# Compila la app de escritorio para Windows y Linux y publica los instaladores
# en una Release de GitHub. Se lanza a mano (Actions → App de escritorio → Run
# workflow) o al subir una etiqueta que empiece por "v" (por ejemplo v0.1.0).
name: App de escritorio

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('escritorio-{0}', github.run_number) }}
          releaseName: 'CalendAN escritorio ${{ github.ref_type == ''tag'' && github.ref_name || github.run_number }}'
          releaseBody: 'Instaladores de CalendAN para Windows (.exe / .msi) y Linux (.deb / .rpm / .AppImage).'
          releaseDraft: false
          prerelease: false
